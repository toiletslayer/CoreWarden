[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "corewarden"
version = "0.2.0"
description = "A local-first, read-only AI monitor for Bitcoin Core-compatible nodes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "CoreWarden contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "botocore[crt]>=1.43.63,<2",
  "openai>=3.6,<4",
  "Pillow>=10,<13",
  "pystray>=0.19.5,<1",
  "pydantic>=2.7,<3",
  "strands-agents>=1.54,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.12,<1"]
package = ["pyinstaller>=6.21,<7"]

[project.scripts]
corewarden = "corewarden.cli:main"

[project.gui-scripts]
corewarden-gui = "corewarden.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/corewarden"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
# The tkinter view is exercised by the packaged-app smoke test. Unit coverage
# targets the desktop service/presenter logic instead of brittle widget events.
omit = ["src/corewarden/gui.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
