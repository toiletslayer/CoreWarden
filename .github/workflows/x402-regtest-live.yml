name: CAP x402 regtest live
on:
  push:
    branches:
      - x402-cap-regtest-ci-20260918

jobs:
  regtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verify official CapStash v27.1.0 and document stock-regtest mining behavior
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://github.com/CapStash/CapStash-Core/releases/download/v27.1.0/CapStash-27.1.0-x86_64-pc-linux-gnu-cli.tar.gz"
          curl -fL --retry 4 --retry-delay 2 "$URL" -o "$RUNNER_TEMP/capstash-official.tar.gz"
          echo "c838622ad29fbac1231263894c946d117b3110d5e24acab5bedf75e79ee954dd  $RUNNER_TEMP/capstash-official.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/official"
          tar -xzf "$RUNNER_TEMP/capstash-official.tar.gz" -C "$RUNNER_TEMP/official"
          OD="$RUNNER_TEMP/official/CapStashd"
          OC="$RUNNER_TEMP/official/CapStash-cli"
          chmod +x "$OD" "$OC"
          "$OD" --version | head -n1
          STOCK="$RUNNER_TEMP/stock"
          mkdir -p "$STOCK"
          "$OD" -regtest -datadir="$STOCK" -server=1 -rpcuser=x402 -rpcpassword=x402-test-only -daemon
          for i in $(seq 1 30); do
            "$OC" -regtest -datadir="$STOCK" -rpcuser=x402 -rpcpassword=x402-test-only getblockchaininfo >/dev/null 2>&1 && break
            sleep 1
          done
          "$OC" -regtest -datadir="$STOCK" -rpcuser=x402 -rpcpassword=x402-test-only createwallet stock
          SA="$("$OC" -regtest -datadir="$STOCK" -rpcuser=x402 -rpcpassword=x402-test-only -rpcwallet=stock getnewaddress stock-miner bech32)"
          echo "STOCK_GENESIS=$("$OC" -regtest -datadir="$STOCK" -rpcuser=x402 -rpcpassword=x402-test-only getblockhash 0)"
          echo "STOCK_DIFFICULTY=$("$OC" -regtest -datadir="$STOCK" -rpcuser=x402 -rpcpassword=x402-test-only getdifficulty)"
          echo "STOCK_HEIGHT_BEFORE=$("$OC" -regtest -datadir="$STOCK" -rpcuser=x402 -rpcpassword=x402-test-only getblockcount)"
          STOCK_GEN="$("$OC" -regtest -datadir="$STOCK" -rpcuser=x402 -rpcpassword=x402-test-only -rpcwallet=stock generatetoaddress 1 "$SA" 1000000)"
          echo "STOCK_GENERATETOADDRESS_1M=$STOCK_GEN"
          echo "STOCK_HEIGHT_AFTER=$("$OC" -regtest -datadir="$STOCK" -rpcuser=x402 -rpcpassword=x402-test-only getblockcount)"
          "$OC" -regtest -datadir="$STOCK" -rpcuser=x402 -rpcpassword=x402-test-only stop || true

      - name: Build v27.1.0 with regtest-only trivial PoW
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config bsdmainutils python3 libevent-dev libboost-dev libsqlite3-dev libdb-dev libdb++-dev
          git clone --depth 1 --branch v27.1.0 https://github.com/CapStash/CapStash-Core.git "$RUNNER_TEMP/capsrc"
          cd "$RUNNER_TEMP/capsrc"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/kernel/chainparams.cpp")
          s=p.read_text()
          marker="class CRegTestParams"
          i=s.index(marker)
          head, reg=s[:i], s[i:]
          old='consensus.powLimit = uint256S("00000001fffe0000000000000000000000000000000000000000000000000000");'
          new='consensus.powLimit = uint256S("7fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff");'
          if old not in reg:
              raise SystemExit("regtest powLimit pattern not found")
          reg=reg.replace(old,new,1)
          old2='consensus.fPowNoRetargeting = true;'
          new2='consensus.fPowNoRetargeting = false; // x402 CI only: allow DGW to select patched trivial powLimit'
          if old2 not in reg:
              raise SystemExit("regtest no-retarget pattern not found")
          reg=reg.replace(old2,new2,1)
          p.write_text(head+reg)
          print("Applied regtest-only PoW patch")
          PY
          git diff -- src/kernel/chainparams.cpp
          ./autogen.sh
          ./configure --without-gui --disable-tests --disable-bench --with-incompatible-bdb CXXFLAGS="-O2"
          make -j2
          echo "CAP_DAEMON=$RUNNER_TEMP/capsrc/src/CapStashd" >> "$GITHUB_ENV"
          echo "CAP_CLI=$RUNNER_TEMP/capsrc/src/CapStash-cli" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/capsrc/src/CapStashd" --version | head -n1

      - name: Start patched isolated regtest node and wallet
        shell: bash
        run: |
          set -euxo pipefail
          DATADIR="$RUNNER_TEMP/cap-regtest"
          mkdir -p "$DATADIR"
          echo "CAP_DATADIR=$DATADIR" >> "$GITHUB_ENV"
          "$CAP_DAEMON" -regtest -datadir="$DATADIR" -server=1 -rpcuser=x402 -rpcpassword=x402-test-only -daemon
          for i in $(seq 1 60); do
            if "$CAP_CLI" -regtest -datadir="$DATADIR" -rpcuser=x402 -rpcpassword=x402-test-only getblockchaininfo >/tmp/chain.json 2>/tmp/rpc.err; then break; fi
            sleep 1
          done
          cat /tmp/chain.json
          "$CAP_CLI" -regtest -datadir="$DATADIR" -rpcuser=x402 -rpcpassword=x402-test-only createwallet x402
          cat > "$RUNNER_TEMP/capcli" <<EOF
          #!/usr/bin/env bash
          exec "$CAP_CLI" -datadir="$DATADIR" -rpcuser=x402 -rpcpassword=x402-test-only -rpcwallet=x402 "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/capcli"
          echo "CAP_WRAPPER=$RUNNER_TEMP/capcli" >> "$GITHUB_ENV"
          echo "PATCHED_GENESIS=$("$RUNNER_TEMP/capcli" -regtest getblockhash 0)"
          echo "PATCHED_DIFFICULTY_AT_GENESIS=$("$RUNNER_TEMP/capcli" -regtest getdifficulty)"

      - name: Run included positive regtest harness
        shell: bash
        run: |
          set -euxo pipefail
          python3 x402-tests/regtest_live_check.py --cli "$CAP_WRAPPER" | tee positive.log

      - name: Run live negative cases
        shell: bash
        run: |
          set -euxo pipefail
          python3 x402-tests/live_negative_cases.py --cli "$CAP_WRAPPER" | tee negative.log

      - name: Node diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== blockchain ==="
          "$CAP_WRAPPER" -regtest getblockchaininfo
          echo "=== mempool ==="
          "$CAP_WRAPPER" -regtest getrawmempool true
          echo "=== debug tail ==="
          tail -n 120 "$CAP_DATADIR/regtest/debug.log" || true
