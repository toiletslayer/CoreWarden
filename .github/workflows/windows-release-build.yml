name: Windows Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install development and packaging dependencies
        run: python -m pip install -e ".[dev,package]"

      - name: Run tests
        run: python -m pytest

      - name: Run lint
        run: python -m ruff check .

      - name: Run synthetic acceptance
        run: python scripts/synthetic_rpc_harness.py acceptance

      - name: Build Windows release
        shell: powershell
        run: .\scripts\build_windows.ps1

      - name: Compute SHA-256
        shell: powershell
        run: |
          $hash = (Get-FileHash .\release\CoreWarden-Windows-x64.zip -Algorithm SHA256).Hash
          "$hash  CoreWarden-Windows-x64.zip" | Out-File -Encoding ascii .\release\SHA256SUMS.txt
          Get-Content .\release\SHA256SUMS.txt

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: CoreWarden-Windows-x64
          path: |
            release/CoreWarden-Windows-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
