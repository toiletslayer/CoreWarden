<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">CoreWarden architecture</title>
  <desc id="desc">Local-first deterministic monitoring, sanitized persistent history and exports, Windows tray operation, and privacy-filtered AI diagnosis through Amazon Bedrock Strands or OpenAI, using exactly four read-only Core RPC methods.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5.5 L0,11 z" fill="#52647a"/></marker>
    <marker id="arrowAws" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5.5 L0,11 z" fill="#e88900"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#172033}.title{font-size:38px;font-weight:700}.subtitle{font-size:19px;fill:#52647a}.section{font-size:19px;font-weight:700;letter-spacing:.8px}.label{font-size:20px;font-weight:650}.small{font-size:16px;fill:#52647a}.tiny{font-size:14px;fill:#52647a}.white{fill:#fff}.awsText{fill:#4b2f00}.privacyText{fill:#123f27}.line{fill:none;stroke:#52647a;stroke-width:3;marker-end:url(#arrow)}.awsLine{fill:none;stroke:#e88900;stroke-width:4;marker-end:url(#arrowAws)}.dash{stroke-dasharray:8 7}.box{rx:16;ry:16;stroke-width:2.5}.shadow{filter:drop-shadow(0 3px 5px rgba(23,32,51,.12))}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="60" y="60" class="title">CoreWarden — local-first node health investigation</text>
  <text x="60" y="94" class="subtitle">Deterministic monitoring stays local. Only sanitized observations may cross the privacy boundary for diagnosis.</text>
  <rect x="40" y="125" width="1370" height="905" rx="24" fill="#f7f9fc" stroke="#7d8da3" stroke-width="2.5"/>
  <text x="70" y="163" class="section">LOCAL COREWARDEN</text><text x="286" y="163" class="small">deterministic, local-first processing</text>
  <rect x="1440" y="125" width="440" height="570" rx="24" fill="#fffaf0" stroke="#d79a2b" stroke-width="2.5"/>
  <text x="1470" y="163" class="section">EXTERNAL MODEL PROVIDERS</text><text x="1470" y="190" class="small">sanitized observations only</text>
  <g class="shadow"><rect x="80" y="215" width="250" height="105" class="box" fill="#172033" stroke="#172033"/><text x="205" y="254" class="label white" text-anchor="middle">User</text><text x="205" y="286" class="small white" text-anchor="middle">Windows GUI / CLI</text></g>
  <g class="shadow"><rect x="390" y="215" width="270" height="105" class="box" fill="#ffffff" stroke="#5b6b82"/><text x="525" y="254" class="label" text-anchor="middle">Desktop / service layer</text><text x="525" y="286" class="small" text-anchor="middle">native Windows application</text></g>
  <g class="shadow"><rect x="730" y="200" width="280" height="135" class="box" fill="#e9f5ff" stroke="#1683c6" stroke-width="3"/><text x="870" y="245" class="label" text-anchor="middle">Local-first monitoring</text><text x="870" y="274" class="label" text-anchor="middle">supervisor</text><text x="870" y="303" class="tiny" text-anchor="middle">scheduled · deduplicated</text><text x="870" y="324" class="tiny" text-anchor="middle">bounded recurrence policy</text></g>
  <g class="shadow"><rect x="1080" y="215" width="270" height="105" class="box" fill="#e9f5ff" stroke="#1683c6" stroke-width="3"/><text x="1215" y="254" class="label" text-anchor="middle">Deterministic health</text><text x="1215" y="286" class="label" text-anchor="middle">evaluation</text></g>
  <g class="shadow"><rect x="730" y="405" width="280" height="120" class="box" fill="#ffffff" stroke="#5b6b82"/><text x="870" y="450" class="label" text-anchor="middle">Diagnosis workflow</text><text x="870" y="484" class="small" text-anchor="middle">only when warranted</text></g>
  <g class="shadow"><rect x="1080" y="405" width="270" height="120" class="box" fill="#ffffff" stroke="#5b6b82"/><text x="1215" y="450" class="label" text-anchor="middle">DiagnosisProvider</text><text x="1215" y="484" class="small" text-anchor="middle">provider-neutral boundary</text></g>
  <g class="shadow"><rect x="1485" y="230" width="350" height="175" class="box" fill="#fff0d2" stroke="#ff9900" stroke-width="4"/><text x="1660" y="278" class="label awsText" text-anchor="middle">Amazon Bedrock / Strands</text><text x="1660" y="314" class="small awsText" text-anchor="middle">primary AWS submission path</text><rect x="1535" y="338" width="250" height="45" rx="10" fill="#ffffff" stroke="#e88900" stroke-width="2"/><text x="1660" y="367" class="small awsText" text-anchor="middle">approved read-only Strands tools</text></g>
  <g class="shadow"><rect x="1485" y="460" width="350" height="145" class="box" fill="#f2f4f7" stroke="#7f8a99"/><text x="1660" y="508" class="label" text-anchor="middle">OpenAI</text><text x="1660" y="541" class="small" text-anchor="middle">secondary supported provider</text><text x="1660" y="574" class="small" text-anchor="middle">approved read-only tools</text></g>
  <g class="shadow"><rect x="80" y="405" width="270" height="120" class="box" fill="#ffffff" stroke="#5b6b82"/><text x="215" y="448" class="label" text-anchor="middle">Sanitized history</text><text x="215" y="481" class="small" text-anchor="middle">allow-listed · newest 1000</text><text x="215" y="507" class="tiny" text-anchor="middle">canonical UTC · atomic local storage</text></g>
  <g class="shadow"><rect x="390" y="405" width="270" height="120" class="box" fill="#ffffff" stroke="#5b6b82"/><text x="525" y="448" class="label" text-anchor="middle">History UI + export</text><text x="525" y="481" class="small" text-anchor="middle">local-time display</text><text x="525" y="507" class="tiny" text-anchor="middle">sanitized JSON / CSV</text></g>
  <g class="shadow"><rect x="80" y="600" width="580" height="95" class="box" fill="#f1f5fa" stroke="#5b6b82"/><text x="370" y="638" class="label" text-anchor="middle">Windows tray / background operation</text><text x="370" y="670" class="small" text-anchor="middle">one Tk root · one monitor · restore / start / stop / quit</text></g>
  <rect x="700" y="600" width="680" height="255" rx="22" fill="#eefaf2" stroke="#2d8a52" stroke-width="4"/>
  <text x="730" y="638" class="section privacyText">PRIVACY BOUNDARY</text><text x="955" y="638" class="small privacyText">peer-identifying and endpoint fields are filtered locally</text>
  <rect x="745" y="680" width="275" height="125" class="box" fill="#ffffff" stroke="#2d8a52" stroke-width="3"/><text x="882" y="722" class="label privacyText" text-anchor="middle">CoreNode projection</text><text x="882" y="756" class="small privacyText" text-anchor="middle">sanitized observations only</text><text x="882" y="782" class="tiny privacyText" text-anchor="middle">shared health / diagnosis interface</text>
  <rect x="1060" y="680" width="275" height="125" class="box" fill="#ffffff" stroke="#2d8a52" stroke-width="3"/><text x="1197" y="722" class="label privacyText" text-anchor="middle">Core RPC adapter</text><text x="1197" y="756" class="small privacyText" text-anchor="middle">validation + privacy filtering</text><text x="1197" y="782" class="tiny privacyText" text-anchor="middle">raw results never reach a provider</text>
  <g class="shadow"><rect x="820" y="900" width="515" height="95" class="box" fill="#ffffff" stroke="#5b6b82"/><text x="1077" y="934" class="label" text-anchor="middle">Read-only JSON-RPC transport</text><text x="1077" y="966" class="small" text-anchor="middle">getblockchaininfo · getnetworkinfo · getpeerinfo · getchaintips</text></g>
  <g class="shadow"><rect x="1500" y="830" width="330" height="125" rx="62" fill="#f1ecff" stroke="#7457b5" stroke-width="3"/><text x="1665" y="881" class="label" text-anchor="middle">Core-compatible node</text><text x="1665" y="916" class="small" text-anchor="middle">exactly four read-only RPC methods</text></g>
  <rect x="80" y="770" width="360" height="95" class="box" fill="#ffffff" stroke="#8a96a8"/><text x="260" y="807" class="label" text-anchor="middle">Windows Credential Manager</text><text x="260" y="839" class="small" text-anchor="middle">optional saved OpenAI key</text>
  <rect x="80" y="900" width="360" height="95" class="box" fill="#ffffff" stroke="#8a96a8"/><text x="260" y="937" class="label" text-anchor="middle">Existing AWS credential chain</text><text x="260" y="969" class="small" text-anchor="middle">profile / session; secrets never enter the GUI</text>
  <path d="M330 267 H390" class="line"/><path d="M660 267 H730" class="line"/><path d="M1010 267 H1080" class="line"/><path d="M870 335 V405" class="line"/><text x="890" y="370" class="tiny">new / materially changed degradation</text>
  <path d="M730 295 C650 345 420 350 350 430" class="line"/><text x="460" y="380" class="tiny">controlled monitoring events</text>
  <path d="M350 465 H390" class="line"/><path d="M205 320 V405" class="line dash"/><text x="220" y="370" class="tiny">History</text>
  <path d="M525 320 V370 H690 V465 H730" class="line"/><text x="565" y="392" class="tiny">manual diagnosis</text><path d="M1010 465 H1080" class="line"/>
  <path d="M1350 447 C1415 430 1425 318 1485 318" class="awsLine"/><path d="M1350 483 C1415 495 1425 530 1485 530" class="line"/>
  <path d="M1485 370 C1400 420 1370 705 1020 725" class="awsLine"/><path d="M1485 565 C1395 610 1320 760 1020 760" class="line"/>
  <path d="M1215 320 V365 H1040 V600 C1040 645 1000 645 1000 680" class="line"/><text x="1050" y="585" class="tiny">local health observations</text>
  <path d="M1020 742 H1060" class="line"/><path d="M1197 805 V900" class="line"/><path d="M1335 947 H1415 V893 H1500" class="line"/><text x="1382" y="930" class="tiny" text-anchor="middle">four calls</text>
  <path d="M1500 920 H1435 V980 H1335" class="line dash"/><text x="1418" y="1007" class="tiny" text-anchor="middle">raw RPC results stay local</text>
  <path d="M1485 290 C1425 300 1425 1015 1385 1015 H500 C465 1015 470 947 440 947" class="line dash"/><text x="620" y="1008" class="tiny">existing profile / session</text>
  <rect x="1480" y="1000" width="360" height="42" rx="10" fill="#eefaf2" stroke="#2d8a52"/><text x="1660" y="1027" class="small privacyText" text-anchor="middle">No remediation or state-changing RPC capability</text>
</svg>
